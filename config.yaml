watchlist:
  - MSFT
  - MU
  - NVTS
  - NVDA
  - GOOGL
  - AMZN
  - LLY
  - JPM

# Claude 크레딧 소진 기간(.env CLAUDE_PRIMARY_UNTIL 과 같은 날짜) 동안만 추가 분석.
# 15종목 x 7회(11/23~12/2, 11/26 휴장) x 약 $1.08 ~= $113. 12/3부터 자동으로 8종목.
extra_watchlist:
  until: "2026-12-02"
  tickers:
    - COST
    - FANG
    - KOID
    - AAPL
    - META
    - AVGO
    - V

risk_limits:
  buy_cash_ratio: 0.95      # 매수에 쓸 USD(외화) 현금 비율 -- 원화는 사용 안 함
  max_position_pct: 40      # 종목당 최대 비중: 총자산(보유 주식 + USD 현금)의 40%
  daily_loss_circuit_pct: -3.0   # 종목별: 보유 종목 당일 손익률이 이 값 이하면 그 종목만 주문 중단
  max_concurrent_positions: 10

schedule:
  run_time_kst: "20:30"     # 분석 시작 (EST 기준, EDT 땐 19:30) -- scripts/run_daily.ps1 이 자동 조정
  trade_time_et: "09:31"    # 분석이 일찍 끝나면 이 시각(미국 동부, 장 시작 1분 후 = KST 23:31/EDT 22:31)까지 기다렸다가 매매

approval:
  enabled: false
  timeout_minutes: 20

regime_switch:
  enabled: false          # 기본 false → 기존 봇과 동일 동작
  proxy_ticker: QQQ
  inverse_ticker: PSQ
  sma_long: 200
  sma_short: 50
  vix_threshold: 25.0
  confirm_days: 2
  max_deploy_pct: 90      # min(매수가능금액, 매도한 종목들의 직전 시장가치 합)의 90%까지 인버스 매수
